name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Se algum teste falhar (contagem de pontos, rodízio, relatórios...),
      # o workflow para aqui e o site NÃO é publicado.
      - name: Testes
        run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Exigência do Rafael: TODA publicação gera um zip do código-fonte guardado
  # como Release no GitHub (aba "Releases" do repositório), pra nunca perder
  # nenhuma versão. Só roda depois que o site foi publicado com sucesso.
  codigo-fonte:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Gerar zip do código-fonte e criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(TZ=America/Sao_Paulo date +%Y-%m-%d_%Hh%M)
          CURTO=$(git rev-parse --short HEAD)
          TAG="versao-${DATA}-${CURTO}"
          ARQUIVO="rdsports-codigo-fonte-${DATA}.zip"
          git archive --format=zip --prefix=rdsports/ -o "$ARQUIVO" HEAD
          git log -1 --format=%B > notas.txt
          gh release create "$TAG" "$ARQUIVO" \
            --title "RDSports ${DATA//_/ }" \
            --notes-file notas.txt \
            --target "$GITHUB_SHA"
